<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f7f4;
            padding: 50px;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: 30px auto;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccc;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🏃 FitBuddy</h1>

        <p>AI-Powered Personalized Fitness Planning</p>

        <h2>Welcome to FitBuddy!</h2>

        <p>
            Create your personalized fitness plan
            and stay healthy.
        </p>

        <button onclick="goToPlan()">
            Get Started
        </button>

    </div>

    <script>
        function goToPlan() {
            window.location.href = "/plan";
        }
    </script>

</body>
</html>
<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy - Fitness Plan</title>
</head>

<body>

    <h1>🏃 FitBuddy</h1>

    <h2>Create Your Fitness Plan</h2>

    <p>Enter your details to create a personalized plan.</p>

    <form>

        <label>Name:</label>
        <input type="text" name="name">
        <br><br>

        <label>Age:</label>
        <input type="number" name="age">
        <br><br>

        <label>Fitness Goal:</label>
        <select name="goal">
            <option value="weight_loss">Weight Loss</option>
            <option value="muscle_gain">Muscle Gain</option>
            <option value="general_fitness">General Fitness</option>
        </select>
        <br><br>

        <button type="submit">Create Plan</button>

    </form>

</body>
</html>
